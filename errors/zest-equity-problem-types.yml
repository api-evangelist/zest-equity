docs: https://docs.zestequity.com/errors
format: custom-envelope
notes: >-
  Zest does NOT use RFC 9457 application/problem+json. Every non-2xx response
  uses a uniform custom envelope with a machine-readable top-level `code`, a
  human `detail`, a stable UUID `errorId` for support correlation, and an
  optional `validationErrors[]` array (present on validation_error) carrying
  per-field codes. Parse `code` first; feed `errorId` into support tickets.
envelope:
  fields:
  - {name: code, type: string, description: Top-level PartnerErrorCode vocabulary value}
  - {name: detail, type: string, description: Human-readable explanation (sanitise before showing end-users)}
  - {name: errorId, type: string(uuid), description: Stable per-error UUID; cite in support}
  - {name: validationErrors, type: array, description: Optional; per-field errors on validation_error}
  schema_ref: PartnerErrorResponse
problems:
- code: validation_error
  status: 400
  title: Contract validation failed
  remediation: Inspect validationErrors[] for the per-field cause.
  source_operations: [createSpvRequest, createSubscriptions]
- code: invalid_request
  status: 400
  title: Syntactically invalid request
  remediation: Missing required header (e.g. Idempotency-Key on POST /v1/spv-requests) or malformed JSON.
- code: invalid_token
  status: 401
  title: Bearer token missing, malformed, or expired
  remediation: Mint a fresh access token via the JWT-bearer flow; check clock skew, aud, and EdDSA algorithm.
  source_operations: [listSpvRequests, getSpvRequest, cancelSpvRequest, bulkCreateInvestors, createSubscriptions]
- code: forbidden
  status: 403
  title: Partner application not provisioned for this resource
  remediation: Token is valid but lacks entitlement; contact Zest onboarding.
  source_operations: [createSpvRequest, bulkCreateInvestors, createSubscriptions]
- code: not_found
  status: 404
  title: Resource does not exist or is not visible to the caller
  source_operations: [getSpvRequest, cancelSpvRequest, createSubscriptions]
- code: conflict
  status: 409
  title: Idempotency-Key conflict, terminal-state mutation, or strict-order violation
  remediation: >-
    Same Idempotency-Key + different body → new key. Cancel of a terminal SPV
    request → 409. Funding upload before signed form on record → 409.
  source_operations: [createSpvRequest, cancelSpvRequest, bulkCreateInvestors, createSubscriptions, uploadSubscriptionForm, uploadFundingReceipt]
- code: payload_too_large
  status: 413
  title: File exceeded the 10 MB upload cap
  source_operations: [uploadSubscriptionForm, uploadFundingReceipt]
- code: unsupported_media_type
  status: 415
  title: Upload content-type not in the allow list (PDF, JPEG, PNG, WEBP)
  source_operations: [uploadSubscriptionForm, uploadFundingReceipt]
- code: internal_error
  status: 500
  title: Server-side failure
  remediation: Retry with backoff; cite errorId if persistent.
- code: service_unavailable
  status: 503
  title: Transient downstream outage
  remediation: Retry with exponential backoff.
validation_error_codes:
- {code: required, meaning: Required field missing}
- {code: unknown_attribute, meaning: Attribute not declared by the contract template}
- {code: type, meaning: Value is the wrong type}
- {code: enum, meaning: Value not in the allowed enum set}
- {code: pattern, meaning: Value did not match the regex constraint}
- {code: max_length, meaning: String exceeded the maximum length}
- {code: min_value, meaning: Number below the minimum}
- {code: max_value, meaning: Number above the maximum}
- {code: format, meaning: Format constraint failed (ISO date, ISO 4217 currency)}
- {code: currency_mismatch, meaning: Multi-currency mismatch within a single object}
- {code: server_supplied, meaning: Field is server-managed and cannot be supplied by partner}
- {code: institutional_not_supported, meaning: Institutional investor type not supported on this template}
