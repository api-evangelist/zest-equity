entries:
- version: v1.0.1
  title: post-launch corrections
  breaking: false
  highlights:
  - subscription.completed is now eventually-consistent — a reconciler actor sweeps every 60 seconds and fires the webhook for any partner-sourced Bid where the synchronous emit was skipped.
  - subscription.completed admin trigger wired through the Zest admin UI (reconciler as backstop).
  - Optional partnerInvestorId added to the signed_subscription_form.uploaded and funding_receipt.uploaded webhook payloads.
  - Partner registration CLI accepts --public-key-b64 for direct key registration and reports duplicate-key collisions gracefully.
  - Spaas contract sync + materialiser expanded to cover remaining Opportunity required fields (is_fixed_price, company_id).
- version: v1.0.0
  title: Initial release
  breaking: false
  highlights:
  - 'Authentication: OAuth 2.0 JWT-Bearer assertion grant via POST /v1/oauth2/tokens.'
  - 'SPV Requests: POST/GET/LIST/DELETE for /v1/spv-requests with admin approve/reject/cancel flow.'
  - 'Investors: bulk-create POST /v1/investors with partial-success semantics.'
  - 'Subscriptions: bulk-create POST /v1/spvs/{slug}/subscriptions.'
  - 'Uploads: signed-form and funding-receipt multipart uploads with strict ordering.'
  - 'Webhooks: nine event types, HMAC-SHA256 signed envelopes, 30s/5m/30m/2h/12h retry schedule + dead-letter.'
  - 'Errors: uniform envelope with stable code vocabulary and per-field validationErrors[].'
  - 'Idempotency: required on POST /v1/spv-requests, optional on other writes, 24h TTL.'
