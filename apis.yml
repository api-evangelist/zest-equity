aid: zest-equity
name: Zest Equity
description: >-
  Zest Equity is the digital infrastructure for private-market transactions —
  built in MENA, used worldwide. Its SPV-as-a-Service platform lets partners
  create DIFC-regulated Special Purpose Vehicles, run FSRA-regulated escrow and
  deal-arranging, bulk-onboard investors, and process subscriptions. The Zest
  Public API exposes this workflow programmatically: OAuth 2.0 JWT-Bearer
  (RFC 7523, EdDSA) authentication, idempotent write endpoints, a versioned
  contract-template engine, and a nine-event HMAC-signed webhook surface — so
  fund managers, family offices, VCs, and PE firms can embed SPV setup, fund
  administration, and regulatory compliance directly inside their own product.
